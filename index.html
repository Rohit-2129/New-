<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b0e"/>
<title>Dolce — Dark Dessert Ordering UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">

    <!-- ══════════ SCREEN 1 — MENU GRID ══════════ -->
    <section class="screen menu" id="menuScreen" aria-label="Menu">
      <header class="topbar">
        <button class="icon-btn white" id="menuBack" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand">
          <span class="brand-word">DOLCE<i>.</i></span>
          <span class="brand-sub">dessert menu</span>
        </div>
        <button class="icon-btn glass" id="menuCartBtn" aria-label="Open cart">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M2.5 3.5h2.2l2.2 11.2a1.8 1.8 0 0 0 1.8 1.4h7.9a1.8 1.8 0 0 0 1.8-1.4L20.5 8H6"/></svg>
          <span class="badge" id="cartBadge" hidden>0</span>
        </button>
      </header>

      <div class="menu-scroll" id="menuScroll"><!-- snap views injected --></div>

      <div class="scroll-hint" id="scrollHint" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <span>swipe</span>
      </div>
      <div class="scroll-progress" aria-hidden="true"><i id="menuProgress"></i></div>
    </section>

    <!-- ══════════ SCREEN 3 — CART ══════════ -->
    <section class="screen cart" id="cartScreen" aria-label="Cart">
      <header class="topbar">
        <button class="icon-btn white" id="cartBack" aria-label="Back to menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="cart-pill" role="button" aria-label="Cart and profile">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M2.5 3.5h2.2l2.2 11.2a1.8 1.8 0 0 0 1.8 1.4h7.9a1.8 1.8 0 0 0 1.8-1.4L20.5 8H6"/></svg>
          <img src="assets/avatar.png" alt="Profile"/>
        </div>
      </header>

      <h1 class="cart-title">Your Cart Items</h1>
      <p class="cart-sub">from the Dolce dessert bar</p>

      <div class="cart-list" id="cartList"><!-- rows injected --></div>

      <footer class="cart-footer">
        <div class="total-row">
          <span class="total-label">Grand Total</span>
          <span class="total-amount"><sup>$</sup><span id="grandTotal">0.00</span></span>
        </div>
        <div class="pay-bar">
          <button class="basket-btn" id="basketBtn" aria-label="Basket">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5h17l-1.6 9.2a2.2 2.2 0 0 1-2.2 1.8H7.3a2.2 2.2 0 0 1-2.2-1.8L3.5 8.5z"/><path d="M8 8.5L12 3l4 5.5"/><path d="M9.7 12.5v3.6M14.3 12.5v3.6"/></svg>
            <span class="badge dark" id="basketBadge">0</span>
          </button>
          <button class="pay-btn" id="payBtn"><span class="pay-label">Make Payment</span><span class="chev" aria-hidden="true">»</span></button>
        </div>
        <div class="progress slim" aria-hidden="true"><i id="cartProgress"></i></div>
      </footer>
    </section>

    <div class="toast" id="toast" role="status"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
